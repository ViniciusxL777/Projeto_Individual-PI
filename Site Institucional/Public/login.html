<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bleach_Info</title>
    <link rel="stylesheet" href="styles/login.css">
    <link rel="shortcut icon" href="assets/icons/Logo-ContornoSemFundo.png" type="image/x-icon">
</head>

<body>
    <div class="entrar">
        <div class="titulo">
            <h1>SIGN-IN</h1>
        </div>
        <div class="textos">
            <div class="email">
                <p>email:</p>
                <input type="text" id="input_email" class="input" placeholder="exemplo@gmail.com">
            </div>
            <div class="senha">
                <p>senha:</p>
                <input type="password" id="input_senha" class="input" placeholder="********">
            </div>
            <div id="div_mensagem"></div>
            <div class="botao">
                <p>Não possui conta?<a href="cadastro.html"> registre-se aqui</a></p>
                <button id="btn-entrar" onclick="autenticar()">ENTRAR</button>
            </div>
        </div>
    </div>

</body>

</html>
<script>
    function autenticar() {
        //Coleta de dados das inputs
        var email = input_email.value
        var senha = input_senha.value

        // Validações
        if (email == `` || senha == ``) {
            div_mensagem.innerHTML = `Preencha todos os campos`
        } else if (!email.includes('@') || !email.includes('.')) {
            div_mensagem.innerHTML = `O email deve conter @ e .`
        } else if (email.indexOf('@') === 0 || email.lastIndexOf('.') === email.length - 1) {
            div_mensagem.innerHTML = `Email inválido: @ não pode ser o primeiro caractere e . não pode ser o último`
        } else if (senha.length < 8) {
            div_mensagem.innerHTML = `A senha deve conter pelo menos 8 caracteres`
        } else {

            fetch("/usuarioRoute/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: email,
                    senhaServer: senha
                })
            }).then(function (resposta) {
                console.log("ESTOU NO THEN DO entrar()!")
                if (resposta.ok) {
                    console.log(resposta);
                    resposta.json().then(json => {
                        console.log(json);
                        console.log(JSON.stringify(json));
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.ID_USUARIO = json.idUsuario;
                        sessionStorage.IMAGEM_PERFIL = json.imagemPerfil;

                        div_mensagem.innerHTML = `Login bem sucedido`
                        setTimeout(() => {
                            window.location = "sociedade_das_almas.html"
                        }, 1000);
                    });
                } else {
                    div_mensagem.innerHTML = "Email e/ou senha inválidos!"
                    resposta.text().then(texto => {
                        console.error(texto);
                    });
                }
            }).catch(function (erro) {
                console.log(erro);
            })
            return false;
        }
    }
</script>
